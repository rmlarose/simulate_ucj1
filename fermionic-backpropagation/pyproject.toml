[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fermionic-backpropagation"
version = "0.1.0"
description = "JAX implementation of the backpropagation algorithm for variational optimization of single-layer UCJ circuits."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyscf",
    "ffsim",
    "jax==0.9.2",
    "jaxlib==0.9.2",
    "tqdm",
]

[tool.setuptools]
packages = ["fermionic_backpropagation"]
package-dir = {"fermionic_backpropagation" = "."}
